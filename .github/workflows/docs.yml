name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Ensure GitHub Pages SEO files
        run: |
          test -f site/.nojekyll
          test -f site/sitemap.xml
          test -f site/sitemap.xml.gz
          test -f site/robots.txt
          grep -Eqi 'name=["'\'']?robots' site/index.html
          grep -q 'index, follow' site/index.html
          ! grep -q 'www.kramlipi.github.io' site/index.html
          python - <<'PY'
          import gzip
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sitemap = Path("site/sitemap.xml")
          ET.parse(sitemap)
          xml = sitemap.read_text(encoding="utf-8")
          assert xml.startswith("<?xml"), "sitemap must start with XML declaration"
          assert "<urlset" in xml and "</urlset>" in xml, "sitemap must contain urlset"
          urls = [el.text.strip() for el in ET.parse(sitemap).iter() if el.tag.endswith("loc")]
          assert urls, "sitemap must list at least one URL"
          for url in urls:
              assert url.startswith("https://kramlipi.github.io/"), url
          gz = gzip.decompress(Path("site/sitemap.xml.gz").read_bytes()).decode("utf-8")
          assert gz == xml, "sitemap.xml.gz must match sitemap.xml"
          print(f"sitemap OK ({len(urls)} URLs)")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout for IndexNow script
        uses: actions/checkout@v4

      - name: Verify live sitemap for Google Search Console
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
              "https://kramlipi.github.io/sitemap.xml" | grep -q "<urlset"; then
              echo "Live sitemap readable"
              exit 0
            fi
            echo "Waiting for Pages CDN... ($i/6)"
            sleep 10
          done
          echo "Live sitemap not readable yet" >&2
          exit 1

      - name: Notify IndexNow (Bing and search partners)
        run: bash scripts/submit-indexnow.sh
