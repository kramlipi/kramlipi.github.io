# Kramlipi Docs — MkDocs Material
# Build: mkdocs build   Serve: mkdocs serve

site_name: Kramlipi
site_url: https://kramlipi.github.io/
site_description: >-
  code-agent — AI CLI for CI failures, failing unit tests, code coverage,
  missing telemetry, and automated merge requests.
site_author: Kramlipi
copyright: Copyright &copy; 2026 Kramlipi

repo_name: kramlipi/kramlipi.github.io
repo_url: https://github.com/kramlipi/kramlipi.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    admonition:
      note: material/information-outline
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow
    - announce.dismiss

hooks:
  - hooks.py

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - meta
  - minify:
      minify_html: true
      htmlmin_opts:
        remove_optional_attribute_quotes: false
  - social:
      cards_layout_options:
        background_color: "#0a0a0a"
        color: "#f97316"

exclude_docs: |
  GITHUB-PAGES-ROOT-URL.md

extra:
  generator: false
  homepage: /
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kramlipi
  alternate:
    - name: Download binary
      link: https://github.com/kramlipi/code-agent-binaries/releases

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Overview:
    - Home: index.md
    - Pains we fix: pains.md
  - Platform:
    - Get started: get-started.md
    - Quick start: quick-start.md
    - Features: features.md
    - Use cases: use-cases.md
    - Experts: experts.md
    - Code review CI: code-review-ci.md
    - Auto verify: auto-verify.md
    - Linter sandbox: linter-sandbox.md
    - Flaky test admin: flaky-test-admin.md
    - Coverage: coverage.md
    - Ultra intelligence: ultra-intelligence.md
  - Tutorials & Blog:
    - All tutorials: articles/index.md
    - "NEW: Smarter Testing M1": articles/smarter-testing-m1-test-intel.md
    - AI that doesn't guess: articles/the-computer-that-doesnt-guess.md
    - Fix failing Python tests: articles/tutorial-python-failing-tests.md
    - Fix failing Go tests: articles/tutorial-go-failing-tests.md
    - Fix failing Java tests: articles/tutorial-java-failing-tests.md
    - Raise coverage: articles/tutorial-raise-coverage.md
    - Bug-fix from CI log: articles/tutorial-bugfix-ci-log.md
    - PR code review: articles/tutorial-pr-code-review.md
    - Ultra intelligence missing Go: articles/tutorial-ultra-intelligence-missing-go.md
  - Reference:
    - Commands: commands.md
    - Recipes: recipes.md
    - Release notes: release-notes.md
    - Troubleshooting: troubleshooting.md
  - Examples:
    - Python: examples/python.md
    - Go: examples/go.md
    - Java: examples/java.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
